name: I would like something new
description: A new feature or a change to how something works.
labels: ["enhancement", "needs-triage"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options:
        - Gateway (the API)
        - Admin app
        - TypeScript SDK
        - Dart and Flutter SDK
        - Python SDK
        - Database adapter
        - Documentation
        - Website
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the job, not the solution. What is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried or considered instead?
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I searched the open issues and did not find this request.
          required: true
