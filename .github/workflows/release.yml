name: Release
# Repositories link to each other by folder until the packages are published,
# so this workflow checks the related repositories out next to this one.
# They are public by default. If any are private, add a repository secret
# CROSS_REPO_TOKEN (a token with read access to the sethucms repositories).

# Push a tag such as v0.1.0 to build, test and attach the packed adapter SDK to a GitHub release.
# Publishing to npm is left off until the packages no longer link to sibling folders.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: [22]
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: sethucms-adapter-sdk
      - name: Check out sethucms
        uses: actions/checkout@v4
        with:
          repository: sethucms/sethucms
          path: sethucms
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Build core
        run: pnpm install --no-frozen-lockfile && pnpm --filter @sethucms/core build
        working-directory: sethucms
      - run: pnpm install --no-frozen-lockfile
        working-directory: sethucms-adapter-sdk
      - run: pnpm build
        working-directory: sethucms-adapter-sdk
      - run: pnpm test
        working-directory: sethucms-adapter-sdk
      - name: Pack
        run: mkdir out && pnpm pack --pack-destination out
        working-directory: sethucms-adapter-sdk
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: sethucms-adapter-sdk/out/*.tgz
