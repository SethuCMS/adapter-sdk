name: Dependabot auto-merge

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Turns on auto-merge for safe Dependabot bumps. GitHub then merges the pull
  # request by itself once every required check is green.
  automerge:
    name: Auto-merge safe bumps
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Read Dependabot details
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check that only dependency files changed
        id: files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          others=$(gh pr diff "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --name-only \
            | grep -v -E '(^|/)(package\.json|pnpm-lock\.yaml|package-lock\.json)$' || true)
          if [ -n "$others" ]; then
            echo "safe=false" >> "$GITHUB_OUTPUT"
            echo "Other files changed, leaving for a person:"
            echo "$others"
          else
            echo "safe=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Turn on auto-merge (patch and minor only)
        if: >-
          steps.files.outputs.safe == 'true' &&
          steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --auto --squash \
            "${{ github.event.pull_request.html_url }}"

  # When main moves, ask Dependabot to rebase its open pull requests so
  # package.json conflicts clear without anyone touching them.
  rebase:
    name: Rebase open Dependabot pull requests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pr in $(gh pr list --repo "${{ github.repository }}" \
            --author 'app/dependabot' --state open \
            --json number --jq '.[].number'); do
            gh pr comment "$pr" --repo "${{ github.repository }}" \
              --body '@dependabot rebase'
          done
